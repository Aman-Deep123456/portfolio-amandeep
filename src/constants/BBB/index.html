<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
    <input type="text" id="display" class="display" readonly>

    <div class="buttons">
  
        <button onclick="press('0')">0</button>
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('+')">+</button>
        <button onclick="press('(')">(</button>
        <button onclick="press('**')">x^y</button>

        
        <button onclick="press('3')">3</button>
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('-')">-</button>
        <button onclick="press(')')">)</button>

     
        <button onclick="press('6')">6</button>
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('*')">x</button>
        <button onclick="press('.')">.</button>


        <button onclick="press('9')">9</button>
        <button onclick="clearDisplay()">C</button>
        <button onclick="calculate()">=</button>
        <button onclick="press('/')">/</button>
        <button onclick="press(',')">,</button>


        <button onclick="reciprocal()">1/x</button>
        <button onclick="press('.')">.</button>
        <button onclick="square()">x²</button>
        <button onclick="press('Math.sqrt(')">√</button>
        <button onclick="press('Math.E')">E</button>

       
        <button onclick="press('Math.PI')">π</button>
        <button onclick="press('Math.LN2')">LN2</button>
        <button onclick="press('Math.LN10')">LN10</button>
        <button onclick="press('Math.LOG2E')">log2E</button>
        <button onclick="press('Math.LOG10E')">log10E</button>

    
      <button onclick="backspace()">←</button>

<button onclick="press('Math.sin(')">sin</button>
<button onclick="press('Math.cos(')">cos</button>
<button onclick="press('Math.tan(')">tan</button>
<button onclick="press('Math.acos(')">acos</button>
<button onclick="press('Math.asin(')">asin</button>

    </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
